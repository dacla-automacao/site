<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — DACLA Automação</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .err-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1rem;
    }
    .err-code {
      font-family: var(--f-mono);
      color: var(--c-accent-2);
      letter-spacing: .2em;
      font-size: .85rem;
    }
    .err-wrap h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      color: var(--c-primary);
      margin: .5rem 0 1rem;
    }
    .err-wrap p { color: var(--c-muted); max-width: 480px; margin: 0 auto 1.5rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="DACLA Automação — início">
        <img src="assets/img/logo.png" alt="DACLA Automação" width="160" height="44">
      </a>
    </div>
  </header>

  <main class="err-wrap">
    <div>
      <span class="err-code">ERRO · 404</span>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi movido. Volte para a página inicial para continuar.</p>
      <a class="btn btn-primary" href="./">Voltar para o início</a>
    </div>
  </main>
</body>
</html>
